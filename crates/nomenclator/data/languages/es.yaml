# The built-in words of `es`. The rules contain them when a library declares `es` or
# declares no language (X11).
season_words:
  add: ["temporada"]
series_season_words:
  add: ["serie"]
leading_articles:
  add: ["el", "la", "los", "las", "un", "una"]
number_words:
  add:
    "uno": 1
    "dos": 2
    "tres": 3
    "cuatro": 4
    "cinco": 5
    "seis": 6
    "siete": 7
    "ocho": 8
    "nueve": 9
    "diez": 10
    "once": 11
    "doce": 12
    "trece": 13
    "catorce": 14
    "quince": 15
    "dieciséis": 16
    "diecisiete": 17
    "dieciocho": 18
    "diecinueve": 19
    "veinte": 20
ordinal_suffixes:
  add: ["ª", "º"]
language_spellings:
  add: { es: ["español", "espanol", "castellano"] }
artwork_roles:
  add: { "cartel": poster, "portada": poster, "caratula": poster, "fondo": backdrop }
episode_words:
  add: ["episodio", "capitulo", "capítulo"]
