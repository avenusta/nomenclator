# The built-in words of `pt`. The rules contain them when a library declares `pt` or
# declares no language (X11).
season_words:
  add: ["temporada"]
series_season_words:
  add: ["série"]
leading_articles:
  add: ["o", "a", "os", "as", "um", "uma"]
number_words:
  add:
    "um": 1
    "dois": 2
    "três": 3
    "quatro": 4
    "cinco": 5
    "seis": 6
    "sete": 7
    "oito": 8
    "nove": 9
    "dez": 10
    "onze": 11
    "doze": 12
    "treze": 13
    "catorze": 14
    "quinze": 15
    "dezesseis": 16
    "dezessete": 17
    "dezoito": 18
    "dezenove": 19
    "vinte": 20
ordinal_suffixes:
  add: ["ª", "º"]
language_spellings:
  add: { pt: ["português", "portugues"] }
artwork_roles:
  add: { "cartaz": poster, "capa": poster, "fundo": backdrop }
episode_words:
  add: ["episodio", "episódio", "capitulo", "capítulo"]
