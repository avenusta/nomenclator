# Language pack `de`: the words a library in this language uses. Applied when a
# caller declares its languages; see decision X11.
name: language-de
season_words:
  add: ["staffel"]
leading_articles:
  add: ["der", "die", "das", "ein", "eine"]
number_words:
  add:
    "eins": 1
    "zwei": 2
    "drei": 3
    "vier": 4
    "fünf": 5
    "sechs": 6
    "sieben": 7
    "acht": 8
    "neun": 9
    "zehn": 10
    "elf": 11
    "zwölf": 12
    "dreizehn": 13
    "vierzehn": 14
    "fünfzehn": 15
    "sechzehn": 16
    "siebzehn": 17
    "achtzehn": 18
    "neunzehn": 19
    "zwanzig": 20
ordinal_suffixes:
  add: ["."]
languages:
  add: { de: ["deutsch"] }
artwork_roles:
  add: { "plakat": poster, "cover": poster, "hintergrund": backdrop }
episode_words:
  add: ["folge"]
