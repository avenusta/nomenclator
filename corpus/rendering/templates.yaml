# Templates (decision R14): a template renders facts into a name.

- name: a movie template renders its fields and pads numbers
  operation: render_template
  input:
    template: "{title}[ ({year})]/{title}[ ({year})][ - part{part:00}]"
    facts: { title: Northern Passage, year: "2021", part: "2" }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021) - part02
    missing_fields: []

- name: an optional section with a field without a value is left out
  operation: render_template
  input:
    template: "{title}[ ({year})]"
    facts: { title: Northern Passage }
  expect:
    path: Northern Passage

- name: a required field without a value renders no path
  operation: render_template
  input:
    template: "{series} - S{season:00}E{episode:00}"
    facts: { series: Quiet Hours, episode: "5" }
  expect:
    path: null
    missing_fields: [season]

- name: doubled braces and brackets are literal characters
  operation: render_template
  input:
    template: "{title} {{tmdb-{tmdb}}} [[{year}]]"
    facts: { title: Arrival, tmdb: "329865", year: "2016" }
  expect:
    path: "Arrival {tmdb-329865} [2016]"

- name: a template with two adjacent fields is invalid
  operation: render_template
  input:
    template: "{title}{year}"
    facts: { title: A }
  expect:
    error: { reason: adjacent_fields }

- name: a template with an unclosed section is invalid
  operation: render_template
  input:
    template: "{title}[ ({year})"
    facts: { title: A }
  expect:
    error: { reason: unclosed_section }
