- name: a loose release-named movie is proposed into its own folder with its profile name
  operation: plan_renames
  input:
    library: movies
    paths:
    - Northern.Passage.2021.1080p.BluRay.x264.mkv
  expect:
    proposals:
    - from: Northern.Passage.2021.1080p.BluRay.x264.mkv
      to: Northern Passage (2021)/Northern Passage (2021).mkv
      case_only: false
      requires_temporary_step: false
      moves_with: null
    blocked: []

- name: sidecars, stem-named files and the other files of a single-movie folder move with its video
  operation: plan_renames
  input:
    library: movies
    paths:
    - Northern Passage 2021/Northern.Passage.2021.1080p.mkv
    - Northern Passage 2021/Northern.Passage.2021.1080p.en.forced.srt
    - Northern Passage 2021/Northern.Passage.2021.1080p.nfo
    - Northern Passage 2021/poster.jpg
    - Northern Passage 2021/notes.txt
  expect:
    proposals:
    - from: Northern Passage 2021/Northern.Passage.2021.1080p.en.forced.srt
      to: Northern Passage (2021)/Northern Passage (2021).en.forced.srt
      moves_with: Northern Passage 2021/Northern.Passage.2021.1080p.mkv
    - from: Northern Passage 2021/Northern.Passage.2021.1080p.mkv
      to: Northern Passage (2021)/Northern Passage (2021).mkv
      moves_with: null
    - from: Northern Passage 2021/Northern.Passage.2021.1080p.nfo
      to: Northern Passage (2021)/Northern Passage (2021).nfo
      moves_with: Northern Passage 2021/Northern.Passage.2021.1080p.mkv
    - from: Northern Passage 2021/notes.txt
      to: Northern Passage (2021)/notes.txt
      moves_with: Northern Passage 2021/Northern.Passage.2021.1080p.mkv
    - from: Northern Passage 2021/poster.jpg
      to: Northern Passage (2021)/poster.jpg
      moves_with: Northern Passage 2021/Northern.Passage.2021.1080p.mkv
    blocked: []

