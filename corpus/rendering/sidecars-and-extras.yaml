- name: a forced English subtitle renders as the video stem with its language and flag
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      provider_ids: { tmdb: '550' }
      container: mkv
      sidecar: { language: en, flags: [forced], extension: srt }
  expect:
    path: Northern Passage (2021) {tmdb-550}/Northern Passage (2021) {tmdb-550}.en.forced.srt
    blocked_reasons: []

- name: subtitle flags are written once each in canonical order with sdh for hearing impaired
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      container: mkv
      sidecar: { language: en, flags: [hearing_impaired, forced, default, forced], extension: srt }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021).en.default.forced.sdh.srt

- name: a regional language is written as its BCP 47 tag
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      container: mkv
      sidecar: { language: pt-BR, extension: SRT }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021).pt-BR.srt

- name: a subtitle without a language writes only its flags
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      container: mkv
      sidecar: { flags: [forced], extension: srt }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021).forced.srt

- name: a subtitle title is written before its language
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      container: mkv
      sidecar: { title: Commentary, language: en, extension: srt }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021).Commentary.en.srt

- name: an external audio track is named like a subtitle
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      container: mkv
      sidecar: { language: de, extension: mka }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021).de.mka

- name: a sidecar of a version part is named after that part's stem
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      version_label: 2160p
      part: 2
      container: mkv
      sidecar: { language: en, extension: srt }
  expect:
    path: Northern Passage (2021)/Northern Passage (2021) - 2160p - part2.en.srt

- name: an episode subtitle is named after the episode stem in its season folder
  operation: render_names
  input:
    facts:
      library: tv
      title: Harbor Lights
      year: 2019
      provider_ids: { tvdb: '81189' }
      season: 1
      episodes: [1]
      episode_title: Low Tide
      container: mkv
      sidecar: { language: en, flags: [hearing_impaired], extension: srt }
  expect:
    path: Harbor Lights (2019) {tvdb-81189}/Season 01/Harbor Lights (2019) - S01E01 - Low Tide.en.sdh.srt

- name: a sidecar without an extension is blocked
  operation: render_names
  input:
    facts:
      library: movies
      title: Northern Passage
      year: 2021
      container: mkv
      sidecar: { language: en }
  expect:
    path: null
    blocked_reasons: [missing_extension]

