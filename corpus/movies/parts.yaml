- name: files with numbered part markers stack under the shared name, and the trailer stays outside the stack
  operation: group_parts
  input:
    paths:
    - Braveheart (1995) cd1.mkv
    - Braveheart (1995) cd2.mkv
    - Braveheart (1995) cd3.mkv
    - Braveheart (1995)-trailer.mp4
  expect:
    stacks:
    - name: Braveheart (1995)
      paths:
      - Braveheart (1995) cd1.mkv
      - Braveheart (1995) cd2.mkv
      - Braveheart (1995) cd3.mkv

- name: files that differ only in a bracketed year are not a stack
  operation: group_parts
  input:
    paths:
    - Cape Fear (1962).mkv
    - Cape Fear (1991).mkv
    - Cape Fear (2030).mkv
  expect:
    stacks: []

- name: files that differ only in a bare year are not a stack
  operation: group_parts
  input:
    paths:
    - Cape.Fear.1962.mkv
    - Cape.Fear.1991.mkv
    - Cape.Fear.2030.mkv
  expect:
    stacks: []

- name: two titles that are numbers and differ only in a bracketed year are not a stack
  operation: group_parts
  input:
    paths:
    - 21 (2008).mkv
    - 21 (2011).mkv
  expect:
    stacks: []

- name: sequels with a number in the title are not a stack
