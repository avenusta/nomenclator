- name: letters attached to a title with no part word are not a stack
  operation: group_parts
  input:
    paths:
    - 21a.mkv
    - 21b.mkv
    - 21c.mkv
    - 21-trailer.mkv
  expect:
    stacks: []

- name: an unrelated entry between two stacks does not split either stack
  operation: group_parts
  input:
    paths:
    - 21 part1.mkv
    - 21 part2.mkv
    - The Usual Suspects
    - Ghostbusters part1.mkv
    - Ghostbusters part2.mkv
    - Ghostbusters part3.mkv
  expect:
    stacks:
    - name: '21'
      paths:
      - 21 part1.mkv
      - 21 part2.mkv
    - name: Ghostbusters
      paths:
      - Ghostbusters part1.mkv
      - Ghostbusters part2.mkv
      - Ghostbusters part3.mkv

