- name: folders with a bracketed disc number are stacked
  operation: group_parts
  input:
    paths:
    - Movies (Action)/Ben-Hur/Ben-Hur (1959) (Disc 01)/
    - Movies (Action)/Ben-Hur/Ben-Hur (1959) (Disc 02)/
  expect:
    stacks:
    - paths:
      - Movies (Action)/Ben-Hur/Ben-Hur (1959) (Disc 01)/
      - Movies (Action)/Ben-Hur/Ben-Hur (1959) (Disc 02)/

- name: parts with a gap are stacked as ambiguous
  operation: group_parts
  input:
    paths:
    - Gladiator (2000) part1.mkv
    - Gladiator (2000) part3.mkv
  expect:
    stacks:
    - name: Gladiator (2000)
      paths:
      - Gladiator (2000) part1.mkv
      - Gladiator (2000) part3.mkv
      ambiguous: true
      ambiguity_reason: missing_part

- name: a repeated part number is stacked as ambiguous
  operation: group_parts
  input:
    paths:
    - Psycho (1960)/Psycho (1960) cd1.mkv
    - Psycho (1960)/Psycho (1960) cd1.avi
    - Psycho (1960)/Psycho (1960) cd2.mkv
  expect:
    stacks:
    - name: Psycho (1960)
      paths:
      - Psycho (1960)/Psycho (1960) cd1.avi
      - Psycho (1960)/Psycho (1960) cd1.mkv
      - Psycho (1960)/Psycho (1960) cd2.mkv
      ambiguous: true
      ambiguity_reason: duplicate_part

- name: contiguous parts are stacked without ambiguity
  operation: group_parts
  input:
    paths:
    - Hugo (2011)/Hugo (2011) - Disc 2.mkv
    - Hugo (2011)/Hugo (2011) - Disc 1.mkv
  expect:
    stacks:
    - name: Hugo (2011)
      paths:
      - Hugo (2011)/Hugo (2011) - Disc 1.mkv
      - Hugo (2011)/Hugo (2011) - Disc 2.mkv
      ambiguous: false
      ambiguity_reason: null
