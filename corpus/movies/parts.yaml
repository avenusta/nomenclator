    stacks:
    - name: 1408 (2007)
      paths:
      - 1408 (2007) part1/
      - 1408 (2007) part2/
      - 1408 (2007) part3/
    - name: The Usual Suspects (1995)
      paths:
      - The Usual Suspects (1995) part1.mkv
      - The Usual Suspects (1995) part2.mkv

