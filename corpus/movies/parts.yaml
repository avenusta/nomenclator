      paths:
      - 21 (2008) parta.mkv
      - 21 (2008) partb.mkv
      - 21 (2008) partc.mkv
      - 21 (2008) partd.mkv

- name: stacks of files and stacks of folders are returned together
  operation: group_parts
  input:
    paths:
    - The Usual Suspects (1995) part1.mkv
    - The Usual Suspects (1995) part2.mkv
    - 1408 (2007) part2/
    - 1408 (2007) part3/
    - 1408 (2007) part1/
