    facts: { kind: movie, title: Northern Passage 2, year: 2024 }
    candidates:
      - { handle: first, kind: movie, title: Northern Passage, year: 2021 }
      - { handle: second, kind: movie, title: Northern Passage 2, year: 2024 }
      - { handle: third, kind: movie, title: Northern Passage 3, year: 2025 }
  expect:
    outcome: selected
    selected: second
    candidates:
      - { handle: second, score: 80 }
      - handle: third
        score: 43
        components:
          - { component: title, points: 33, reason: similar_title, matched_title: Northern Passage 3 }
          - { component: year, points: 10, reason: year_within_tolerance }
      - { handle: first, score: 40, contradictions: [{ component: year, reason: year_beyond_tolerance }] }

