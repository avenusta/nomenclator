- name: a candidate with the facts' provider ID is selected over a candidate with a better title match
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021, provider_ids: { tmdb: '550' } }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 2021, provider_ids: { tmdb: '9001' } }
      - { handle: b, kind: movie, title: Southern Crossing, year: 2021, provider_ids: { tmdb: '550' } }
  expect:
    outcome: selected
    selected: b
    reason: provider_id
    candidates:
      - handle: b
        score: 120
        components:
          - { component: provider_id, points: 100, reason: same_id, provider: tmdb }
          - { component: title, points: 0, reason: dissimilar_title }
          - { component: year, points: 20, reason: same_year }
        contradictions: []
      - handle: a
        score: 80
        contradictions: [{ component: provider_id, reason: different_id, provider: tmdb }]

- name: an exact title match does not outscore a conflicting provider ID of the same namespace
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021, provider_ids: { tmdb: '550' } }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 2021, provider_ids: { tmdb: '9001' } }
  expect:
    outcome: no_match
    selected: null
    reason: all_contradicted

- name: a provider ID of another namespace neither matches nor contradicts
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021, provider_ids: { tmdb: '550' } }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 2021, provider_ids: { imdb: tt0000550 } }
  expect:
    outcome: selected
    selected: a
    reason: best_score
    candidates:
      - handle: a
        score: 80
        components:
          - { component: title, points: 60, reason: exact_title, matched_title: Northern Passage }
          - { component: year, points: 20, reason: same_year }
        contradictions: []

- name: a candidate with one matching ID and one conflicting ID is a contradiction
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, provider_ids: { tmdb: '550', imdb: tt0000550 } }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, provider_ids: { tmdb: '550', imdb: tt0000999 } }
  expect:
    outcome: no_match
    reason: provider_id_match_contradicted
    candidates:
      - handle: a
        contradictions: [{ component: provider_id, reason: different_id, provider: imdb }]

- name: when the matching ID candidate is contradicted, no other candidate is selected by title
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021, provider_ids: { tmdb: '550' } }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 1987, provider_ids: { tmdb: '550' } }
      - { handle: b, kind: movie, title: Northern Passage, year: 2021 }
  expect:
    outcome: no_match
    selected: null
    reason: provider_id_match_contradicted

- name: two uncontradicted candidates with the facts' ID are ambiguous
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, provider_ids: { tmdb: '550' } }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, provider_ids: { tmdb: '550' } }
      - { handle: b, kind: movie, title: Northern Passage (Extended), provider_ids: { tmdb: '550' } }
  expect:
    outcome: ambiguous
    selected: null
    reason: several_provider_id_matches
    tied: [a, b]

- name: a series candidate is never selected for movie facts, even with a matching title
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021 }
    candidates:
      - { handle: series, kind: series, title: Northern Passage, year: 2021 }
      - { handle: movie, kind: movie, title: Northern Passage, year: 2021 }
  expect:
    outcome: selected
    selected: movie
    candidates:
      - { handle: movie, score: 80, contradictions: [] }
      - { handle: series, score: 80, contradictions: [{ component: kind, reason: different_kind }] }

- name: a kind mismatch alone returns no match
  operation: rank_candidates
  input:
    facts: { kind: series, title: Northern Passage, year: 2021 }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 2021 }
