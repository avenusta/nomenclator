    outcome: no_match
    reason: all_contradicted

- name: facts without a kind accept a candidate of any kind
  operation: rank_candidates
  input:
    facts: { title: Northern Passage, year: 2021 }
    candidates:
      - { handle: a, kind: series, title: Northern Passage, year: 2021 }
  expect:
    outcome: selected
    selected: a

- name: a year one off is within tolerance and scores less than the same year
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021 }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 2022 }
  expect:
    outcome: selected
    selected: a
    candidates:
      - handle: a
        score: 70
        components:
          - { component: title, points: 60, reason: exact_title, matched_title: Northern Passage }
          - { component: year, points: 10, reason: year_within_tolerance }
        contradictions: []

- name: a year two off contradicts
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021 }
    candidates:
      - { handle: a, kind: movie, title: Northern Passage, year: 2019 }
  expect:
    outcome: no_match
    reason: all_contradicted
    candidates:
      - handle: a
        score: 60
        components:
          - { component: title, points: 60, reason: exact_title, matched_title: Northern Passage }
          - { component: year, points: 0, reason: year_beyond_tolerance }
        contradictions: [{ component: year, reason: year_beyond_tolerance }]

- name: two candidates one year off the facts in each direction are a tie
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage, year: 2021 }
    candidates:
      - { handle: earlier, kind: movie, title: Northern Passage, year: 2020 }
      - { handle: later, kind: movie, title: Northern Passage, year: 2022 }
  expect:
    outcome: ambiguous
    reason: tied_scores
    tied: [earlier, later]

- name: a year missing on either side is neither evidence nor contradiction
  operation: rank_candidates
  input:
    facts: { kind: movie, title: Northern Passage }
